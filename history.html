<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎌</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">ANIMEUZ</a>
      <nav class="nav">
        <a href="index.html" class="nav-link">Bosh sahifa</a>
        <a href="catalog.html" class="nav-link">Animelar</a>
        <a href="favorites.html" class="nav-link">Sevimlilar</a>
        <a href="history.html" class="nav-link active">Tarix</a>
        <a href="about.html" class="nav-link">Biz haqimizda</a>
      </nav>
      <div class="header-actions">
        <button class="search-btn">🔍</button>
        <a href="favorites.html" class="fav-btn-wrap search-btn" style="position:relative">❤️<span class="favorite-count" style="display:none">0</span></a>
        <button class="theme-btn">☀️</button>
        <button class="menu-btn">☰</button>
      </div>
    </div>
  </header>
  <div class="mobile-menu">
    <a href="index.html" class="nav-link">Bosh sahifa</a>
    <a href="catalog.html" class="nav-link">Animelar</a>
    <a href="favorites.html" class="nav-link">Sevimlilar</a>
    <a href="history.html" class="nav-link">Tarix</a>
    <a href="about.html" class="nav-link">Biz haqimizda</a>
  </div>
  <div class="search-overlay">
    <div class="search-box">
      <div class="search-input-wrap"><span>🔍</span><input type="text" class="search-input" placeholder="Anime qidirish..."><button class="close-search btn-icon">✕</button></div>
      <div class="search-results"></div>
    </div>
  </div>

  <main class="container">
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px">
      <div>
        <h1>Ko'rilganlar tarixi</h1>
        <p>Telegram orqali ochgan animelaringiz</p>
      </div>
      <button id="clear-hist" class="btn btn-ghost btn-sm">Tarixni tozalash</button>
    </div>
    <div id="history-list"></div>
  </main>

  <footer class="footer"><div class="container"><div class="footer-bottom"><p>© 2026 ANIMEUZ</p></div></div></footer>
  <div class="toast-container"></div>

  <script src="js/data.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/history.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const list = document.getElementById('history-list');
      const hist = AnimeUZHistory.getHistory();
      if (hist.length === 0) {
        list.innerHTML = `<div class="empty-state">
          <div class="icon">📜</div>
          <h3>Tarix bo'sh</h3>
          <p>Tomosha qilish tugmasini bosgan animelar shu yerda ko'rinadi</p>
          <a href="catalog.html" class="btn btn-primary">Animelarni ko'rish</a>
        </div>`;
      } else {
        list.innerHTML = hist.map(h => {
          const date = new Date(h.date).toLocaleString('uz-UZ');
          return `<div class="history-item">
            <img src="${escapeHtml(h.poster)}" alt="" loading="lazy" onerror="this.src='https://via.placeholder.com/60x85'">
            <div class="info">
              <div style="font-weight:600;margin-bottom:4px">${escapeHtml(h.title)}</div>
              <div class="date">${date}</div>
            </div>
            <a href="details.html?id=${h.id}" class="btn btn-ghost btn-sm">Batafsil</a>
          </div>`;
        }).join('');
      }
      document.getElementById('clear-hist').addEventListener('click', () => {
        if (confirm('Tarixni tozalaysizmi?')) {
          AnimeUZHistory.clearHistory();
          location.reload();
        }
      });
    });
  </script>
</body>
</html>
