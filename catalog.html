<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animelar katalogi | ANIMEUZ</title>
  <meta name="description" content="100+ anime katalogi. Qidiruv, janr, yil, reyting bo'yicha filtrlar.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎌</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">ANIMEUZ</a>
      <nav class="nav">
        <a href="index.html" class="nav-link">Bosh sahifa</a>
        <a href="catalog.html" class="nav-link active">Animelar</a>
        <a href="catalog.html" class="nav-link">Janrlar</a>
        <a href="favorites.html" class="nav-link">Sevimlilar</a>
        <a href="history.html" class="nav-link">Tarix</a>
        <a href="about.html" class="nav-link">Biz haqimizda</a>
      </nav>
      <div class="header-actions">
        <button class="search-btn" aria-label="Qidiruv">🔍</button>
        <a href="favorites.html" class="fav-btn-wrap search-btn" style="position:relative">❤️<span class="favorite-count" style="display:none">0</span></a>
        <button class="theme-btn">☀️</button>
        <button class="menu-btn">☰</button>
      </div>
    </div>
  </header>
  <div class="mobile-menu">
    <a href="index.html" class="nav-link">Bosh sahifa</a>
    <a href="catalog.html" class="nav-link">Animelar</a>
    <a href="favorites.html" class="nav-link">Sevimlilar</a>
    <a href="history.html" class="nav-link">Tarix</a>
    <a href="about.html" class="nav-link">Biz haqimizda</a>
  </div>
  <div class="search-overlay">
    <div class="search-box">
      <div class="search-input-wrap">
        <span>🔍</span>
        <input type="text" class="search-input" placeholder="Anime qidirish..." autocomplete="off">
        <button class="close-search btn-icon">✕</button>
      </div>
      <div class="search-results"></div>
    </div>
  </div>

  <main class="container">
    <div class="page-header">
      <h1>Animelar katalogi</h1>
      <p>100+ anime orasidan o'zingiznikini toping</p>
    </div>

    <div class="filters-panel">
      <div class="filter-group" style="flex:1;min-width:180px">
        <label>Qidiruv</label>
        <input type="text" id="filter-search" placeholder="Nomi yoki janr...">
      </div>
      <div class="filter-group">
        <label>Janr</label>
        <select id="filter-genre">
          <option value="">Barchasi</option>
          <option value="Action">Action</option>
          <option value="Adventure">Adventure</option>
          <option value="Comedy">Comedy</option>
          <option value="Drama">Drama</option>
          <option value="Fantasy">Fantasy</option>
          <option value="Romance">Romance</option>
          <option value="Horror">Horror</option>
          <option value="Mystery">Mystery</option>
          <option value="Sports">Sports</option>
          <option value="Sci-Fi">Sci-Fi</option>
          <option value="Supernatural">Supernatural</option>
          <option value="Slice of Life">Slice of Life</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Yil</label>
        <select id="filter-year"><option value="">Barchasi</option></select>
      </div>
      <div class="filter-group">
        <label>Reyting</label>
        <select id="filter-rating">
          <option value="">Barchasi</option>
          <option value="9">9+</option>
          <option value="8">8+</option>
          <option value="7">7+</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Turi</label>
        <select id="filter-type">
          <option value="">Barchasi</option>
          <option value="TV">TV</option>
          <option value="Movie">Movie</option>
          <option value="ONA">ONA</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Holati</label>
        <select id="filter-status">
          <option value="">Barchasi</option>
          <option value="Tugallangan">Tugallangan</option>
          <option value="Davom etmoqda">Davom etmoqda</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Saralash</label>
        <select id="filter-sort">
          <option value="rating-desc">Reyting (yuqori)</option>
          <option value="rating-asc">Reyting (past)</option>
          <option value="year-desc">Yil (yangi)</option>
          <option value="year-asc">Yil (eski)</option>
          <option value="title-asc">Alifbo (A-Z)</option>
          <option value="title-desc">Alifbo (Z-A)</option>
          <option value="views-desc">Ko'rishlar</option>
        </select>
      </div>
      <div class="filter-group" style="justify-content:flex-end">
        <label>&nbsp;</label>
        <button id="clear-filters" class="btn btn-ghost btn-sm">Tozalash</button>
      </div>
    </div>

    <div class="results-info" id="results-info"></div>
    <div class="anime-grid" id="catalog-grid"></div>
    <div class="pagination" id="pagination"></div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>© 2026 ANIMEUZ. Barcha huquqlar himoyalangan.</p>
      </div>
    </div>
  </footer>
  <div class="toast-container"></div>

  <script src="js/data.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/history.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
